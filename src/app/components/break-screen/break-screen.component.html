<div class="break-overlay">
    <div class="background-blobs">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <div class="break-content glass">
        <div class="break-header">
            <div class="icon-container">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-eye">
                    <path
                        d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 20.276 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-20.276 0" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
            </div>
            <h2>Eyes Resting...</h2>
            <p>Look at something <strong>20 feet away</strong> to relax your eye muscles.</p>
        </div>

        <div class="break-timer-wrapper">
            <svg viewBox="0 0 100 100" class="break-progress-svg">
                <circle class="bg" cx="50" cy="50" r="45"></circle>
                <circle class="progress" cx="50" cy="50" r="45"
                    [style.stroke-dashoffset]="getOffset(progress$ | async)"></circle>
            </svg>
            <div class="counter-display">
                <span class="seconds">{{ timeLeft$ | async }}</span>
                <span class="label">sec</span>
            </div>
        </div>

        <div class="tips-carousel">
            <div class="tip-item">✨ Blink your eyes 10 times slowly</div>
            <div class="tip-item">✨ Breathe deeply and relax your shoulders</div>
        </div>

        <div class="break-footer">
            <button class="skip-btn" (click)="skipBreak()">Skip Break</button>
        </div>
    </div>
</div>
